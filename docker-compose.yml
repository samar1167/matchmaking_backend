version: '3.9'
services:
  db:
    image: mysql:8.0
    container_name: matchmaking_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    networks:
      - matchmaking_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  # redis:
  #   image: redis:7-alpine
  #   container_name: matchmaking_redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - matchmaking_net
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 3
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: matchmaking_web
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/app
      - /app/matchmaking_project/staticfiles:/app/matchmaking_project/staticfiles
      - media_files:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      # redis:
      #   condition: service_healthy
    networks:
      - matchmaking_net
    command: /app/entrypoint.sh
  nginx:
    image: nginx:alpine
    container_name: matchmaking_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /app/matchmaking_project/staticfiles:/app/matchmaking_project/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      - web
    networks:
      - matchmaking_net
volumes:
  mysql_data:
  static_files:
  media_files:
networks:
  matchmaking_net:
    driver: bridge
